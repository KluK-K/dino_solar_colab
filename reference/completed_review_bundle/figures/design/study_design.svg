   <g id="text_1">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b40" x="18" y="21.6" transform="rotate(-0 18 21.6)">Study design and information exposure</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677b" x="18" y="43.92" transform="rotate(-0 18 43.92)">One source-reviewed freeze; complete systems, annotation budgets and failure strata retained</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b40" x="27.36" y="89.034422" transform="rotate(-0 27.36 89.034422)">A  Development inputs</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 113.785313)">SCDD: 351 train + 120 val</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 127.285313)">UCF: 430 train + 144 val</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 140.785312)">Source masks inform dense fits</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 153.413437)">Validation selects checkpoints,</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 166.913437)">rates, temperature and</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 180.413438)">the image operating threshold</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b40" x="210.96" y="89.034422" transform="rotate(-0 210.96 89.034422)">B  Complete recipes</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(210.96 113.431641)">Frozen DINOv3 / LoRA / full</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(210.96 126.413437)">Adapted CNNs and local ports</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(210.96 140.326172)">Classical, reference and</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(210.96 153.413437)">optimization controls</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(210.96 167.326172)">427 families; 1,061 views</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b40" x="394.56" y="89.033633" transform="rotate(-0 394.56 89.033633)">C  Frozen once</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(394.56 112.70825)">Original weights and rules</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(394.56 125.90825)">1,683 prediction jobs</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(394.56 139.10825)">6,212 endpoint contrasts</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(394.56 152.30825)">Fixed populations and cases</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(394.56 165.50825)">No target-driven changes</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b40" x="556.56" y="89.034422" transform="rotate(-0 556.56 89.034422)">D  Saved predictions</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(556.56 112.70825)">SCDD: 117 images; 1,061 jobs</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(556.56 125.90825)">UCF: 507 images; 311 jobs</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(556.56 139.10825)">PVEL: 12,326 images; 311 jobs</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(556.56 152.30825)">Same saved PVEL scores yield</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(556.56 165.50825)">primary 12,292 + sensitivities</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b40" x="27.36" y="278.394422" transform="rotate(-0 27.36 278.394422)">Study-wide design exposure</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 302.06825)">Both UCF and SCDD development informed the study.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 315.26825)">86 UCF training + 144 validation masks are inside 574 HPO images.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 328.46825)">18 SCDD training masks at 5% require 120 validation masks too.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(27.36 341.66825)">Sample-disjoint prediction does not erase research-selection exposure.</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10.1px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172b40" x="394.56" y="278.394422" transform="rotate(-0 394.56 278.394422)">Complete analysis and narrower inference</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(394.56 302.06825)">Matching held-source SCDD strata: ARTS 43 / CFVS 27 / CSIR 47.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(394.56 315.26825)">All declared contrasts and both frozen secondary policies.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(394.56 328.46825)">Conditional, unadjusted family intervals; pooled pixel AP point-only.</text>
    <text style="font-size: 8.8px; font-family: 'DejaVu Sans'; fill: #172b40" transform="translate(394.56 341.66825)">PVEL boxes cannot support mask Dice or a capture-family CI.</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677b" x="19.44" y="406.08" transform="rotate(-0 19.44 406.08)">Separate evidence: 97 source cost cases; ELPV: 24 outer fits / 480 inner-grid fits on 1,968 development images.</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677b" x="19.44" y="427.68" transform="rotate(-0 19.44 427.68)">Views and deterministic reuse are not new training replications. Physical modules and pretraining membership remain unverified.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52677b" x="19.44" y="449.28" transform="rotate(-0 19.44 449.28)">This diagram summarizes the frozen design. It contains no predictive results, model ranking or added scientific choice.</text>
   </g>
  </g>
 </g>
